# Agent OS Docker Compose Configuration
# Production-ready multi-service deployment

version: "3.8"

services:
  # =============================================================================
  # Main Application
  # =============================================================================
  agentos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: agentos:latest
    container_name: agentos-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENT_OS_WEB_PORT:-8080}:8080"
    environment:
      # SECURITY: Binds to all interfaces inside container (reached via port mapping above).
      # Host-side binding restricted to 127.0.0.1. Use a reverse proxy for external access.
      - AGENT_OS_WEB_HOST=0.0.0.0
      - AGENT_OS_WEB_PORT=8080
      - AGENT_OS_DATA_DIR=/app/data
      # SECURITY: Authentication required - API key must be set
      - AGENT_OS_REQUIRE_AUTH=${AGENT_OS_REQUIRE_AUTH:-true}
      - AGENT_OS_API_KEY=${AGENT_OS_API_KEY:?AGENT_OS_API_KEY must be set - generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"}
      - AGENT_OS_FORCE_HTTPS=${AGENT_OS_FORCE_HTTPS:-true}
      - AGENT_OS_RATE_LIMIT_ENABLED=${AGENT_OS_RATE_LIMIT_ENABLED:-true}
      - AGENT_OS_RATE_LIMIT_REDIS=${AGENT_OS_RATE_LIMIT_REDIS:-true}
      - AGENT_OS_REDIS_URL=redis://redis:6379
    volumes:
      - agentos-data:/app/data
      - agentos-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agentos-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # =============================================================================
  # Redis (Rate Limiting & Caching)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: agentos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agentos-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

# =============================================================================
# Networks
# =============================================================================
networks:
  agentos-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  agentos-data:
    driver: local
  agentos-logs:
    driver: local
  redis-data:
    driver: local
